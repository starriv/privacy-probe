name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 单元测试 + Lint + Debug 构建
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4

      - name: 从源码构建原生采集器
        run: |
          sdkmanager "ndk;28.0.12674087"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.12674087" ./scripts/build-native.sh

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 单元测试 + Lint
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug

      - name: 组装 Debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: 上传测试 / Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: privacy-probe-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
