name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '仅构建不发布时的版本号（可选）'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4

      - name: 从源码构建原生采集器
        run: |
          sdkmanager "ndk;28.0.12674087"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.12674087" ./scripts/build-native.sh

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 解析版本号
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.version }}"
            [[ -n "$VERSION" ]] || VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          # versionCode 必须随版本单调递增：semver 映射为 major*10000 + minor*100 + patch
          # （1.1.0 -> 10100，高于历史 versionCode=2，可直接覆盖升级）
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            CODE=$((10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]}))
          else
            CODE=$((GITHUB_RUN_NUMBER + 1000))
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "release version: $VERSION (versionCode=$CODE)"

      - name: 准备发布签名
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PRIVPROBE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/signing"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/privprobe.keystore"
            echo "PRIVPROBE_KEYSTORE_PATH=$RUNNER_TEMP/signing/privprobe.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::正式发布必须配置 PRIVPROBE_KEYSTORE_BASE64"
            exit 1
          else
            echo "::warning::未配置 PRIVPROBE_KEYSTORE_BASE64，使用 debug keystore 签名（仅适合测试分发）"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 单元测试 + Lint + Release 构建
        env:
          PRIVPROBE_KEYSTORE_PASSWORD: ${{ secrets.PRIVPROBE_KEYSTORE_PASSWORD }}
          PRIVPROBE_KEY_ALIAS: ${{ secrets.PRIVPROBE_KEY_ALIAS }}
          PRIVPROBE_KEY_PASSWORD: ${{ secrets.PRIVPROBE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            -PrequireReleaseSigning="${{ startsWith(github.ref, 'refs/tags/v') }}" \
            -PappVersionName="${{ steps.ver.outputs.version }}" \
            -PappVersionCode="${{ steps.ver.outputs.code }}"

      - name: 校验产物与签名
        env:
          PRIVPROBE_KEYSTORE_PASSWORD: ${{ secrets.PRIVPROBE_KEYSTORE_PASSWORD }}
          PRIVPROBE_KEY_ALIAS: ${{ secrets.PRIVPROBE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-signature.txt
          if [[ -n "${PRIVPROBE_KEYSTORE_PATH:-}" ]]; then
            EXPECTED=$(keytool -exportcert -keystore "$PRIVPROBE_KEYSTORE_PATH" \
              -storepass:env PRIVPROBE_KEYSTORE_PASSWORD -alias "${PRIVPROBE_KEY_ALIAS:-androiddebugkey}" | sha256sum | awk '{print $1}')
            ACTUAL=$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/apk-signature.txt | head -1 | tr -d '[:space:]')
            echo "expected certificate SHA-256: $EXPECTED"
            echo "actual   certificate SHA-256: $ACTUAL"
            [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "::error::APK 签名证书不匹配"; exit 1; }
          fi
          mkdir -p dist
          cp "$APK" "dist/privacy-probe-${{ steps.ver.outputs.version }}.apk"
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: privacy-probe-release
          path: dist/*
          retention-days: 30

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PrivacyProbe ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/privacy-probe-${{ steps.ver.outputs.version }}.apk
            dist/mapping.txt
            dist/SHA256SUMS.txt
          body: |
            ## PrivacyProbe ${{ steps.ver.outputs.version }}

            - Release APK（arm64-v8a，minSdk 31 / Android 12+）
            - `mapping.txt`：R8 混淆映射表，用于还原崩溃堆栈（与本次 APK 一一对应）
            - `SHA256SUMS.txt`：产物校验和

            > 需要 KernelSU / Magisk 等 root 环境；仅用于你持有并授权的设备。
            > 安装与首次使用见仓库 README。
